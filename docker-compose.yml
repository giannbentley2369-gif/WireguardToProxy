services:
  wireguard-to-proxy:
    build:
      context: .
      args:
        SING_BOX_VERSION: "1.14.4"
    image: wireguard-to-proxy:latest
    container_name: wireguard-to-proxy
    # Host networking: the WebUI and every proxy bind WGPROXY_LISTEN_HOST (127.0.0.1 by default) of
    # the host itself, and the outer VPN client's SOCKS5 port (127.0.0.1:2080) is reachable on loopback.
    network_mode: host
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    # Override any of these in a .env file next to this file (see README, "VPS deployment").
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      WGPROXY_WEBUI_PORT: ${WGPROXY_WEBUI_PORT:-8080}
      # 0.0.0.0 exposes the WebUI and every proxy on all interfaces.
      WGPROXY_LISTEN_HOST: ${WGPROXY_LISTEN_HOST:-127.0.0.1}
      # Host/IP written into exported proxy URLs; empty = derived automatically.
      WGPROXY_PUBLIC_HOST: ${WGPROXY_PUBLIC_HOST:-}
      # Extra host names/IPs the WebUI may be opened with (Host header allowlist).
      WGPROXY_ALLOWED_HOSTS: ${WGPROXY_ALLOWED_HOSTS:-194.36.188.178,localhost,127.0.0.1}
      # WebUI login; an empty password keeps the optional password from the Settings page.
      WGPROXY_WEBUI_USERNAME: ${WGPROXY_WEBUI_USERNAME:-admin}
      WGPROXY_WEBUI_PASSWORD: ${WGPROXY_WEBUI_PASSWORD:-}
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp
    # Userspace only: no NET_ADMIN, no TUN device, no routing or firewall changes.
    # These capabilities are used solely by the entrypoint to fix ./data ownership before it
    # drops root; the WebUI and sing-box run unprivileged as PUID:PGID.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-m", "wgproxy", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
