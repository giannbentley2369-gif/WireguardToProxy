[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wireguard-to-proxy"
version = "1.0.0"
description = "Self-hosted WebUI that turns WireGuard configs into local SOCKS5/HTTP proxies with userspace sing-box tunnels"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx[socks]>=0.28",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
wgproxy = "wgproxy.__main__:main"

[tool.setuptools.packages.find]
include = ["wgproxy*"]

[tool.setuptools.package-data]
wgproxy = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    # Starlette's TestClient announces a future switch to httpx2; irrelevant for these tests.
    "ignore:Using .httpx. with .starlette.testclient. is deprecated:UserWarning",
]

[tool.ruff]
line-length = 120
target-version = "py311"
